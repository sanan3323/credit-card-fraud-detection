[tool.pytest.ini_options]
# Put the repo root on sys.path so `import src...` resolves under bare `pytest`
# (not just `python -m pytest`), including on CI runners.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
